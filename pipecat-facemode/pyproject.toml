[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-facemode"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "FaceMode"}]
keywords = ["pipecat", "avatar", "facemode", "ai", "video", "realtime", "livekit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

description = "FaceMode avatar integration for Pipecat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pipecat-ai>=1.7,<2",
    "livekit>=1.1,<2",
    "aiohttp>=3.10,<4",
    "websockets>=14,<17",
    "numpy>=2,<3",
]

[project.urls]
Homepage = "https://facemode.io"
Repository = "https://github.com/facemode-by-infinitylevel/facemode-integrations"

[tool.setuptools.packages.find]
include = ["pipecat_facemode*"]
