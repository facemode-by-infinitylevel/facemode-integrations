[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-facemode"
version = "0.1.0"
description = "FaceMode avatar integration for Pipecat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pipecat-ai>=1.7,<2",
    "livekit>=1.1,<2",
    "aiohttp>=3.10,<4",
    "websockets>=14,<17",
    "numpy>=2,<3",
]

[tool.setuptools.packages.find]
include = ["pipecat_facemode*"]
